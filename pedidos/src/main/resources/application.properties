spring.application.name=pedidos

spring.datasource.url=jdbc:postgresql://localhost:5555/icompraspedidos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto= none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

icompras.pedidos.clients.produtos.url=http://localhost:8081/produtos
icompras.pedidos.clients.clientes.url=http://localhost:8082/clientes